<style>
:root{
  --substrate:#07080A;
  --substrate-2:#0D0F13;
  --gold:#D4A83C;
  --gold-bright:#F4DE9E;
  --gold-deep:#7E611B;
  --ivory:#F2EDE3;
  --muted:#8C8676;
  --sheen:linear-gradient(100deg,var(--gold-deep) 0%,var(--gold) 24%,var(--gold-bright) 44%,var(--gold) 64%,var(--gold-deep) 100%);

  /* ── the signature font for the name ──────────────────
     Swap the one word below to change the whole look:
       "Great Vibes"  → flowing, wide swashes (closest to Andalucia / Maddison)
       "Parisienne"   → slightly more upright, elegant
       "Alex Brush"   → thin brush pen, more casual
     ───────────────────────────────────────────────────── */
  --script:"Great Vibes";
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,button,input,label{-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--substrate);color:var(--ivory);
  font-family:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:300;line-height:1.6;
  min-height:100svh;
}

/* ═══ the split ═══════════════════════════════════════ */
.split{
  display:grid;
  grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);
  min-height:100svh;
}

/* ── left: the photograph ───────────────────────────── */
.photo{position:relative;overflow:hidden;background:var(--substrate-2)}
.photo picture{position:absolute;inset:0;display:block}
.photo img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 22%;
  opacity:0;animation:reveal 1.8s cubic-bezier(.2,.7,.2,1) .15s forwards;
}
.photo::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(7,8,10,.34) 0%,transparent 22%,transparent 62%,rgba(7,8,10,.92) 100%);
}
.photo-cap{
  position:absolute;left:0;right:0;bottom:clamp(1.1rem,2.6vh,2rem);
  text-align:center;z-index:2;
  font-family:"IBM Plex Mono",monospace;font-size:.55rem;
  letter-spacing:.34em;text-transform:uppercase;color:var(--gold);
  opacity:0;animation:reveal 1.4s ease 1.2s forwards;
  text-shadow:0 1px 12px rgba(7,8,10,.9);
}
@keyframes reveal{to{opacity:1}}

/* ── right: the invitation ──────────────────────────── */
.panel{
  position:relative;display:flex;flex-direction:column;justify-content:center;
  gap:clamp(1rem,2.4vh,1.9rem);
  padding:clamp(2rem,5vh,3.4rem) clamp(1.5rem,4.5vw,4rem);
  border-left:1px solid rgba(212,168,60,.2);
}
.panel::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 60% at 100% 0%,rgba(212,168,60,.08),transparent 65%);
}
.panel > *{position:relative}

.kicker{
  margin:0;font-family:"IBM Plex Mono",monospace;
  font-size:clamp(.52rem,.72vw,.62rem);letter-spacing:.4em;
  text-transform:uppercase;color:var(--muted);
}
.kicker em{color:var(--gold);font-style:normal}

.name{
  margin:0 -.14em 0 -.22em;          /* pulls the padding back so nothing shifts */
  font-family:var(--script),"Bodoni Moda",cursive;font-weight:400;
  font-size:clamp(2.2rem,min(9vw,12vh),6rem);
  line-height:1.18;letter-spacing:0;text-transform:none;
  white-space:nowrap;                /* Carine Ghanem stays on one line */
  padding:.1em .14em .16em .22em;    /* room for the C swash + descenders */
  background:var(--sheen);background-size:280% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sheen 3s cubic-bezier(.3,.8,.2,1) .35s forwards;
}
.name span{display:inline}
@keyframes sheen{to{background-position:0 0}}

.line{
  margin:0;font-family:"Bodoni Moda",Georgia,serif;font-style:italic;
  font-size:clamp(.95rem,min(2.1vw,2.7vh),1.4rem);line-height:1.4;color:var(--ivory);
  max-width:26ch;
}
.line b{font-weight:400;color:var(--gold-bright)}

.hair{height:1px;background:linear-gradient(90deg,rgba(212,168,60,.4),rgba(212,168,60,.05) 70%,transparent);margin:0}

/* when & where */
.facts{display:grid;gap:clamp(.6rem,1.5vh,1.05rem);margin:0}
.fact{display:grid;grid-template-columns:4.1rem 1fr;gap:1rem;align-items:baseline}
.fact dt{
  margin:0;font-family:"IBM Plex Mono",monospace;
  font-size:clamp(.5rem,.68vw,.58rem);letter-spacing:.26em;
  text-transform:uppercase;color:var(--muted);padding-top:.5em;
}
.fact dd{margin:0}
.fact strong{
  display:block;font-family:"Bodoni Moda",Georgia,serif;font-weight:400;
  font-size:clamp(1.02rem,min(2.2vw,2.9vh),1.5rem);line-height:1.22;
  color:var(--gold-bright);letter-spacing:-.008em;
}
.fact small{
  display:block;color:var(--muted);
  font-size:clamp(.72rem,1.1vw,.85rem);letter-spacing:.03em;margin-top:.12rem;
}

/* ── form ───────────────────────────────────────────── */
.rsvp{display:grid;gap:clamp(.7rem,1.7vh,1.15rem);margin:0}
.rsvp-head{
  margin:0;font-family:"IBM Plex Mono",monospace;
  font-size:clamp(.5rem,.68vw,.58rem);letter-spacing:.26em;
  text-transform:uppercase;color:var(--gold);
}
.inp{
  width:100%;background:transparent;border:0;
  border-bottom:1px solid rgba(212,168,60,.32);
  color:var(--ivory);font-family:"Bodoni Moda",Georgia,serif;
  font-size:clamp(1rem,min(2.2vw,2.8vh),1.35rem);font-weight:400;
  padding:.35em 0 .5em;transition:border-color .35s ease;
}
.inp::placeholder{color:rgba(140,134,118,.5);font-style:italic}
.inp:focus{outline:0;border-bottom-color:var(--gold)}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.choice{position:relative;margin:0}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice span{
  display:block;text-align:center;cursor:pointer;
  border:1px solid rgba(212,168,60,.45);background:rgba(242,237,227,.028);
  padding:.95em .6em;
  font-family:"IBM Plex Mono",monospace;
  font-size:clamp(.55rem,.76vw,.65rem);letter-spacing:.16em;
  text-transform:uppercase;color:#BDB6A4;
  transition:border-color .3s,color .3s,background .3s;
}
.choice span:hover{border-color:rgba(212,168,60,.62);color:var(--ivory)}
.choice input:checked + span{
  border-color:var(--gold);color:var(--gold-bright);
  background:rgba(212,168,60,.09);box-shadow:inset 0 0 20px rgba(212,168,60,.07);
}
.choice input:focus-visible + span{outline:1px solid var(--gold-bright);outline-offset:3px}

/* the reluctant "no" */
.choice.shy{transition:transform .34s cubic-bezier(.34,1.5,.4,1),opacity .34s ease;will-change:transform}
.choice.shy span{transition:font-size .3s ease,letter-spacing .3s ease,color .3s ease,border-color .3s ease}
.choice.shy.caved span{border-color:rgba(212,168,60,.45)}

.btn{
  appearance:none;cursor:pointer;text-decoration:none;display:inline-block;
  font-family:"IBM Plex Mono",monospace;
  font-size:clamp(.56rem,.78vw,.66rem);letter-spacing:.22em;
  text-transform:uppercase;padding:1em 2rem;border:1px solid var(--gold);
  color:var(--substrate);background:var(--sheen);background-size:220% 100%;
  transition:background-position .65s ease,transform .28s ease;
  justify-self:start;
}
.btn:hover{background-position:100% 0;transform:translateY(-2px)}
.btn:focus-visible{outline:1px solid var(--gold-bright);outline-offset:4px}
.btn[disabled]{opacity:.55;cursor:wait;transform:none}

.msg{
  margin:0;min-height:1.1em;font-family:"IBM Plex Mono",monospace;
  font-size:clamp(.52rem,.72vw,.6rem);letter-spacing:.16em;
  text-transform:uppercase;color:#E3A9A9;
}

/* confirmation */
.done{display:none}
.sent .done{display:grid;gap:.7rem}
.sent .live{display:none}
.done h2{
  margin:0;font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-weight:400;
  font-size:clamp(1.3rem,min(3.2vw,4.2vh),2.2rem);color:var(--gold-bright);
}
.done p{margin:0;color:var(--muted);font-size:clamp(.82rem,1.2vw,.95rem);max-width:32ch}

.spark{position:fixed;width:5px;height:5px;border-radius:50%;background:var(--gold-bright);pointer-events:none;z-index:60}

/* golden confetti layer */
#confetti{
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:80;display:none;
}

/* ── mobile: stack, with its own type scale ─────────── */
@media (max-width:820px){
  .split{grid-template-columns:1fr;min-height:0}

  /* the photo now grows with the screen instead of a fixed 4:3 box.
     62svh leaves the top of the invitation just peeking, which is
     what tells people there's more below. */
  .photo{
    height:62vh;height:62svh;min-height:290px;max-height:660px;
    aspect-ratio:auto;
  }
  .photo picture{position:absolute;inset:auto;top:0;left:0;right:0;bottom:0;height:100%}
  .photo img{position:absolute;object-position:50% 46%}
  .photo::after{background:linear-gradient(180deg,rgba(7,8,10,.3) 0%,transparent 26%,transparent 58%,rgba(7,8,10,.97) 100%)}
  .photo-cap{font-size:10.5px;letter-spacing:.3em;bottom:1rem}

  .panel{
    border-left:0;border-top:1px solid rgba(212,168,60,.2);
    justify-content:flex-start;gap:.88rem;padding-top:1.25rem;
    padding-left:max(1.35rem,calc(env(safe-area-inset-left) + 1.1rem));
    padding-right:max(1.35rem,calc(env(safe-area-inset-right) + 1.1rem));
    padding-bottom:max(1.9rem,calc(env(safe-area-inset-bottom) + 1.35rem));
  }

  .kicker{font-size:11px;letter-spacing:.34em}
  .name{font-size:clamp(2rem,11vw,3.4rem);line-height:1.18}
  .line{font-size:17px;line-height:1.45;max-width:none}
  .hair{margin:0}

  .facts{gap:.8rem}
  .fact{grid-template-columns:3.9rem 1fr;gap:.85rem}
  .fact dt{font-size:10.5px;letter-spacing:.22em;padding-top:.35em}
  .fact strong{font-size:19px;line-height:1.28}
  .fact small{font-size:13px;margin-top:.2rem}

  .rsvp{gap:.85rem}
  .rsvp-head{font-size:11px;letter-spacing:.22em}
  .inp{font-size:17px;padding:.45em 0 .6em}   /* 17px stops iOS zooming on focus */

  .choices{gap:.6rem}
  .choice span{
    display:flex;align-items:center;justify-content:center;
    min-height:54px;padding:.7em .5em;
    font-size:12.5px;letter-spacing:.1em;line-height:1.25;text-align:center;
  }
  .btn{width:100%;justify-self:stretch;min-height:54px;padding:1em;font-size:12.5px;letter-spacing:.18em}
  .msg{font-size:11px;letter-spacing:.12em}
  .done h2{font-size:clamp(1.4rem,7vw,2rem)}
  .done p{font-size:15px;max-width:none}
}

/* short phones: give the panel the room instead of the photo */
@media (max-width:820px) and (max-height:730px){
  .photo{height:56vh;height:56svh;min-height:250px}
  .panel{gap:.85rem;padding-top:1.2rem}
  .name{font-size:clamp(1.9rem,10vw,3rem)}
}

/* phone held sideways */
@media (max-width:900px) and (orientation:landscape){
  .split{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
  .photo{aspect-ratio:auto;height:100%;max-height:none}
  .photo img{position:absolute}
  .photo::after{background:linear-gradient(90deg,rgba(7,8,10,.3) 0%,transparent 25%,rgba(7,8,10,.9) 100%)}
  .panel{border-top:0;border-left:1px solid rgba(212,168,60,.2);justify-content:center;gap:.6rem;padding-top:1rem}
  .name{font-size:clamp(1.7rem,7.5vh,2.8rem)}
  .line{font-size:14px}
  .fact strong{font-size:16px}
  .choice span{min-height:46px;font-size:11.5px}
  .btn{min-height:46px;font-size:11.5px}
}

@media (max-width:400px){
  .fact{grid-template-columns:1fr;gap:.1rem}
  .fact dt{padding-top:0}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.12s!important}
  .photo img,.photo-cap{opacity:1}
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════ */
const CONFIG = {
  dateLabel:  "Sunday 9 August",
  timeLabel:  "8:30 pm",
  venue:      "Ghanem's Kroum",
  address:    "Near Sunny Land",
  rsvpBy:     "as soon as possible",

     // country code + number, no "+"

  // Paste your Google Apps Script Web App URL here so every reply
  // is saved. Setup steps are in rsvp-collector-apps-script.js.
  // Left empty, guests send their answer to you on WhatsApp instead.
  formEndpoint: "https://script.google.com/macros/s/AKfycbykrYh2Qjq_qqxyK1GxJVZels1us094aR3k7teoxTTsTvB7VtDxikd8mLfQA35tvsPn/exec"
};
/* ═══════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

$("v-date").textContent   = CONFIG.dateLabel;
$("v-time").textContent   = CONFIG.timeLabel;
$("v-venue").textContent  = CONFIG.venue;
$("v-addr").textContent   = CONFIG.address;


/* keep "Carine Ghanem" on one line, whatever the screen */
const nameEl = document.querySelector(".name");
function fitName(){
  nameEl.style.fontSize = "";
  let size = parseFloat(getComputedStyle(nameEl).fontSize);
  let guard = 60;
  while(nameEl.scrollWidth > nameEl.clientWidth + 1 && size > 15 && guard--){
    size -= size * .04;
    nameEl.style.fontSize = size + "px";
  }
}
fitName();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitName);
addEventListener("resize", fitName);
addEventListener("orientationchange", () => setTimeout(fitName, 120));

function sparks(el){
  if(reduce) return;
  const r = el.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height/2;
  for(let i=0;i<16;i++){
    const s = document.createElement("i");
    s.className = "spark"; s.style.left = cx+"px"; s.style.top = cy+"px";
    document.body.appendChild(s);
    const a = Math.random()*Math.PI*2, d = 36+Math.random()*92;
    s.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},
      {transform:`translate(${Math.cos(a)*d-4}px,${Math.sin(a)*d-4}px) scale(0)`,opacity:0}],
      {duration:660+Math.random()*480,easing:"cubic-bezier(.2,.7,.2,1)"}).onfinish = () => s.remove();
  }
}

/* ── golden confetti ──────────────────────────────────────
   Falls across the whole screen when someone says yes.
   ───────────────────────────────────────────────────────── */
function confetti(){
  if(reduce) return;
  const c = $("confetti"), ctx = c.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = c.width  = innerWidth  * dpr;
  const H = c.height = innerHeight * dpr;
  c.style.display = "block";

  const golds = ["#D4A83C","#F4DE9E","#EFC75E","#FFF3CF","#B8891F"];
  const count = innerWidth < 520 ? 100 : 180;
  const bits  = [];

  for(let i = 0; i < count; i++){
    bits.push({
      x: Math.random() * W,
      y: -Math.random() * H * 0.8 - 20 * dpr,
      w: (4 + Math.random() * 7) * dpr,
      h: (8 + Math.random() * 13) * dpr,
      vy: (2.2 + Math.random() * 3.6) * dpr,
      vx: (Math.random() - .5) * 1.4 * dpr,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .24,
      sway: Math.random() * Math.PI * 2,
      col: golds[(Math.random() * golds.length) | 0]
    });
  }

  const start = performance.now();
  function frame(now){
    const t = now - start;
    ctx.clearRect(0, 0, W, H);
    let onscreen = 0;

    for(const b of bits){
      b.sway += .05;
      b.x += b.vx + Math.sin(b.sway) * .9 * dpr;
      b.y += b.vy;
      b.rot += b.vr;
      if(b.y < H + 40 * dpr) onscreen++;

      ctx.save();
      ctx.globalAlpha = t > 4200 ? Math.max(0, 1 - (t - 4200) / 1500) : 1;
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.col;
      // the flip on the vertical axis makes each piece feel like foil
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.rot)) + 1);
      ctx.restore();
    }

    if(t < 5800 && (onscreen || t < 2600)) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, W, H); c.style.display = "none"; }
  }
  requestAnimationFrame(frame);
}

function confirmView(name, coming, saved){
  $("doneTitle").textContent = coming ? "See you there." : "Thank you for telling me.";
  $("doneMsg").textContent = coming
    ? `Your seat is counted, ${name}.`
    : `You'll be missed, ${name}. I'll send you photos.`;

  $("doneActs").innerHTML = saved ? "" :
    `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}?text=${
      encodeURIComponent(coming
        ? `Ciao Carine! It's ${name} — I'll be there on ${CONFIG.dateLabel}. Congratulations!`
        : `Ciao Carine! It's ${name} — I can't make it, but congratulations. I'm so proud of you.`)
    }">Send it on WhatsApp</a>`;

  $("rsvp").classList.add("sent");
  sparks($("rsvp"));
  if(coming) confetti();
}

async function submit(){
  const name = $("fName").value.trim();
  const picked = document.querySelector('input[name="attending"]:checked');
  const msg = $("msg");

  if(!name){ msg.textContent = "Add your name first"; $("fName").focus(); return; }
  if(!picked){ msg.textContent = "Pick yes or no"; $("rYes").focus(); return; }
  msg.textContent = "";

  const coming = picked.value === "yes";

  if(!CONFIG.formEndpoint){ confirmView(name, coming, false); return; }

  const btn = $("send");
  btn.disabled = true; btn.textContent = "Sending…";
  let saved = false;
  try{
    // text/plain keeps this a "simple" request, so no CORS preflight
    const res = await fetch(CONFIG.formEndpoint, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ name, attending: coming ? "yes" : "no" })
    });
    saved = res.ok;
  }catch(e){ saved = false; }
  btn.disabled = false; btn.textContent = "Send my answer";
  confirmView(name, coming, saved);
}

/* ── the reluctant "no" ───────────────────────────────────
   It shrinks, runs away and protests a few times. After
   PATIENCE attempts it gives up and can be selected.
   ───────────────────────────────────────────────────────── */
const noWrap  = $("noWrap");
const noLabel = $("noLabel");
const PATIENCE = 4;
const PROTESTS = ["Why??", "Excuse me?!", "Are you serious", "Rude."];
const CAVED    = "Fine… I can't come";
let tries = 0;

function flee(){
  tries++;
  if(tries > PATIENCE){                 // it gives up
    noWrap.classList.add("caved");
    noLabel.textContent = CAVED;
    noWrap.style.transform = "none";
    noWrap.style.opacity = "1";
    return false;                       // let the click through
  }
  noLabel.textContent = PROTESTS[tries - 1];
  const dir = tries % 2 ? 1 : -1;
  const dx  = dir * (14 + tries * 7);
  const dy  = dir * -5;
  const rot = dir * (2 + tries);
  noWrap.style.transform =
    `translate(${dx}px,${dy}px) rotate(${rot}deg) scale(${Math.max(.5, 1 - tries * .13)})`;
  noWrap.style.opacity = String(Math.max(.5, 1 - tries * .12));
  return true;                          // blocked
}

// clicks / taps: block until patience runs out
noWrap.addEventListener("click", e => {
  if(noWrap.classList.contains("caved")) return;
  if(flee()){ e.preventDefault(); e.stopPropagation(); }
}, true);

// on a mouse, it also flinches when you come near
if(matchMedia("(hover:hover) and (pointer:fine)").matches && !reduce){
  noWrap.addEventListener("mouseenter", () => {
    if(!noWrap.classList.contains("caved") && tries < PATIENCE) flee();
  });
}

// if it ends up chosen, stop the theatrics for good
$("rNo").addEventListener("change", () => {
  noWrap.classList.add("caved");
  noWrap.style.transform = "none";
  noWrap.style.opacity = "1";
  noLabel.textContent = CAVED;
});
// picking yes resets it, so a change of heart still gets the joke
$("rYes").addEventListener("change", () => {
  sparks($("rYes").nextElementSibling);
  if(noWrap.classList.contains("caved")) return;
  tries = 0;
  noLabel.textContent = "Sorry, I can't";
  noWrap.style.transform = "none";
  noWrap.style.opacity = "1";
});

$("send").addEventListener("click", submit);
$("fName").addEventListener("keydown", e => {
  if(e.key === "Enter"){ e.preventDefault(); submit(); }
});
</script>
